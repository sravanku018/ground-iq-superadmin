# Deploys GitHub Pages for either:
#   ground-iq-web        → Client Admin  (https://sravanku018.github.io/ground-iq-web/)
#   ground-iq-superadmin → Super Admin   (https://sravanku018.github.io/ground-iq-superadmin/)
#
# Both repos run this workflow; build flags depend on which repo is deploying.
# Source of truth is always ground-iq-web@main.

name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.repository }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: sravanku018/ground-iq-web
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Super Admin console vs Client Admin portal
      - name: Build site
        env:
          VITE_BASE: ${{ github.repository == 'sravanku018/ground-iq-superadmin' && '/ground-iq-superadmin/' || '/ground-iq-web/' }}
          VITE_FIELD_APP: '0'
          VITE_SUPER_ADMIN: ${{ github.repository == 'sravanku018/ground-iq-superadmin' && '1' || '0' }}
        run: |
          echo "Building for ${{ github.repository }}"
          echo "VITE_BASE=$VITE_BASE VITE_SUPER_ADMIN=$VITE_SUPER_ADMIN VITE_FIELD_APP=$VITE_FIELD_APP"
          npm run build
      # SPA deep links + real /admin/ (Client Admin path) as HTTP 200
      - run: |
          cp dist/index.html dist/404.html
          mkdir -p dist/admin
          cp dist/index.html dist/admin/index.html
          # Sanity: base path must match this Pages site
          head -40 dist/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
