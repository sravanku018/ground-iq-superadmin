name: Deploy Super Admin console to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: sravanku018/ground-iq-web
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_BASE: /ground-iq-superadmin/
          VITE_FIELD_APP: 0
          VITE_SUPER_ADMIN: 1
      # SPA: 404.html for deep links. Also real /admin/ so Client Admin is HTTP 200
      # (not 404→404.html), which avoids sticky cached shells that still name
      # deleted Vite hashes (MIME text/html on module load).
      - run: |
          cp dist/index.html dist/404.html
          mkdir -p dist/admin
          cp dist/index.html dist/admin/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
