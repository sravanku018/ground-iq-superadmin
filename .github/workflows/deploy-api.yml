# API deploys from https://github.com/sravanku018/ground-iq-api
# (Deno console GitHub integration — no paste, no token).
# This workflow is kept only as a manual fallback.

name: Deploy API

on:
  workflow_dispatch:

jobs:
  deploy:
    if: github.repository == 'sravanku018/ground-iq-web' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Deploy hono-api to Deno
        uses: denoland/deployctl@v1
        with:
          project: ground-iq-api
          entrypoint: main.ts
          root: hono-api
          import-map: deno.json
        env:
          DENO_DEPLOY_TOKEN: ${{ secrets.DENO_DEPLOY_TOKEN }}
