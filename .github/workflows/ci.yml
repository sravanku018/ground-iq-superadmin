# The gate this repo was missing. Until now the only workflow was the manual
# Deno-deploy fallback, so nothing ever ran `npm run lint` or `npm run build`
# except a human — oxlint was installed and configured but wired to nothing.
#
# This runs alongside the Vercel deploy, it does not gate it. To make it block a
# merge, require the "gate" check in the repo's branch protection rules.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Whole-repo lint, warnings visible but not fatal: the 11 remaining ones
      # are all pre-existing, in the legacy API files and a parked deno folder.
      - name: Lint
        run: npm run lint

      # The gate: src and test must stay warning-free. Verified to exit 1 on a
      # new unused variable, so dead code cannot quietly accumulate again.
      - name: Lint strict
        run: npm run lint:strict

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
